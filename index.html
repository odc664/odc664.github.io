<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Selma</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0a0a0a;
    color: #fff;
    height: 100vh;
    overflow: hidden;
  }

  /* Şifre */
  #lock {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3000;
    transition: opacity 0.8s ease;
  }
  #lock.hide {
    opacity: 0;
    pointer-events: none;
  }
  .lock-box {
    text-align: center;
    width: 290px;
  }
  .lock-box h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    letter-spacing: 12px;
    margin-bottom: 36px;
    color: #ffb3c9;
  }
  .lock-box input {
    width: 100%;
    padding: 15px;
    border: 1px solid rgba(255,160,190,0.3);
    background: rgba(255,255,255,0.04);
    color: #fff;
    font-size: 1.05rem;
    text-align: center;
    border-radius: 8px;
    outline: none;
    letter-spacing: 3px;
  }
  .lock-box button {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    border: 1px solid rgba(255,160,190,0.4);
    background: transparent;
    color: #ffb3c9;
    font-size: 0.95rem;
    letter-spacing: 3px;
    border-radius: 8px;
    cursor: pointer;
  }
  .err {
    margin-top: 14px;
    color: #ff6b8a;
    font-size: 0.85rem;
    height: 18px;
  }

  /* Açılış Animasyonu */
  #intro {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    z-index: 2000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.4s ease;
  }
  #intro.show {
    opacity: 1;
    pointer-events: auto;
  }
  #intro.hide {
    opacity: 0;
    pointer-events: none;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .matrix {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .matrix span {
    position: absolute;
    color: rgba(255,140,180,0.4);
    font-size: 13px;
    white-space: nowrap;
    animation: fall linear infinite;
    text-shadow: 0 0 8px rgba(255,100,150,0.4);
  }
  @keyframes fall {
    0% { transform: translateY(-30px); opacity: 0; }
    15% { opacity: 0.8; }
    90% { opacity: 0.3; }
    100% { transform: translateY(100vh); opacity: 0; }
  }

  /* Ana Ekran - Pembe */
  #main {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    background: linear-gradient(160deg, #2a1020 0%, #4a1830 40%, #6b2040 100%);
    z-index: 10;
    overflow: hidden;
  }
  #main.show {
    display: flex;
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.8rem, 9vw, 3.8rem);
    letter-spacing: 10px;
    color: #ffd0e0;
    margin-bottom: 16px;
    opacity: 0;
    transform: translateY(25px) scale(0.95);
    transition: all 1.5s cubic-bezier(0.22, 1, 0.36, 1);
    text-shadow: 0 0 40px rgba(255,150,180,0.4);
    animation: breathe 4.5s ease-in-out infinite;
    animation-play-state: paused;
  }
  .title.show {
    opacity: 1;
    transform: none;
    animation-play-state: running;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  .line {
    width: 0;
    height: 1.5px;
    background: linear-gradient(90deg, transparent, #ffb3c9, transparent);
    margin-bottom: 28px;
    transition: width 1.3s ease 0.5s;
  }
  .line.show {
    width: 50px;
  }

  .text {
    max-width: 340px;
    font-size: 1.12rem;
    font-weight: 300;
    line-height: 1.95;
    color: rgba(255,240,245,0.92);
    opacity: 0;
    transform: translateY(20px);
    transition: all 1.5s ease 0.8s;
  }
  .text.show {
    opacity: 1;
    transform: none;
  }
  .text p {
    margin-bottom: 14px;
  }

  .sign {
    margin-top: 40px;
    font-size: 0.72rem;
    letter-spacing: 3px;
    color: rgba(255,200,220,0.35);
    opacity: 0;
    transition: all 1.5s ease 1.4s;
  }
  .sign.show {
    opacity: 1;
  }

  /* Ana ekran arka plan kalpleri */
  .bg-hearts {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }
  .bh {
    position: absolute;
    color: rgba(255,180,200,0.12);
    animation: float linear infinite;
  }
  @keyframes float {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    15% { opacity: 0.7; }
    85% { opacity: 0.3; }
    100% { transform: translateY(-20vh) rotate(30deg); opacity: 0; }
  }
</style>
</head>
<body>

  <!-- Şifre -->
  <div id="lock">
    <div class="lock-box">
      <h2>SELMA</h2>
      <input type="password" id="pass" placeholder="••••" autocomplete="off">
      <button onclick="check()">GİRİŞ</button>
      <div class="err" id="err"></div>
    </div>
  </div>

  <!-- Açılış Animasyonu -->
  <div id="intro">
    <canvas id="canvas"></canvas>
    <div class="matrix" id="matrix"></div>
  </div>

  <!-- Ana Ekran -->
  <div id="main">
    <div class="bg-hearts" id="hearts"></div>

    <div class="title" id="title">SELMA</div>
    <div class="line" id="line"></div>
    <div class="text" id="text">
      <p>Bazı insanlar sadece güzel değildir.</p>
      <p>Bulundukları yere de güzellik bırakırlar.</p>
      <p>Sen onlardan birisin.</p>
    </div>
    <div class="sign" id="sign">ODÇ664</div>
  </div>

<script>
  // Şifre
  function check() {
    const v = document.getElementById('pass').value.trim();
    if (v === "odç" || v === "odc") {
      document.getElementById('lock').classList.add('hide');
      setTimeout(startIntro, 600);
    } else {
      document.getElementById('err').innerText = "Yanlış şifre";
      document.getElementById('pass').value = "";
    }
  }
  document.getElementById('pass').addEventListener('keypress', e => {
    if (e.key === 'Enter') check();
  });

  // Canvas Kalp
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let w, h, progress = 0;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function heartPoint(t, scale) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    return {
      x: w/2 + x * scale,
      y: h/2 + y * scale
    };
  }

  const colors = [];
  for (let i = 0; i < 120; i++) {
    colors.push(`hsl(${i * 3}, 90%, 65%)`);
  }

  function draw() {
    ctx.fillStyle = 'rgba(10,10,10,0.1)';
    ctx.fillRect(0, 0, w, h);

    const scale = Math.min(w, h) * 0.018;

    for (let i = 0; i < 90; i++) {
      const t = (i / 90) * Math.PI * 2 * Math.min(progress, 1);
      const p = heartPoint(t, scale);

      ctx.beginPath();
      ctx.moveTo(w/2, h/2);
      ctx.lineTo(p.x, p.y);
      ctx.strokeStyle = colors[i % colors.length];
      ctx.lineWidth = 1.3;
      ctx.globalAlpha = 0.75;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.globalAlpha = 0.95;
    for (let t = 0; t < Math.PI * 2 * Math.min(progress, 1); t += 0.02) {
      const p = heartPoint(t, scale);
      if (t === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = '#ff6b9d';
    ctx.lineWidth = 2.2;
    ctx.shadowBlur = 18;
    ctx.shadowColor = '#ff4d7a';
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    progress += 0.0055;

    if (progress < 1.25) {
      requestAnimationFrame(draw);
    }
  }

  // Yağan yazılar
  const messages = ["Seni Seviyorum :)", "Selma", "İyi ki varsın", "♥", "Seni düşünüyorum", "ODÇ664"];
  
  function createMatrix() {
    const box = document.getElementById('matrix');
    const interval = setInterval(() => {
      if (!document.getElementById('intro').classList.contains('show')) {
        clearInterval(interval);
        return;
      }
      const span = document.createElement('span');
      span.innerText = messages[Math.floor(Math.random() * messages.length)];
      span.style.left = Math.random() * 100 + 'vw';
      span.style.fontSize = (12 + Math.random() * 7) + 'px';
      span.style.animationDuration = (5 + Math.random() * 6) + 's';
      box.appendChild(span);
      setTimeout(() => span.remove(), 12000);
    }, 260);
  }

  // Ana ekran kalpleri
  function createBgHearts() {
    const box = document.getElementById('hearts');
    for (let i = 0; i < 10; i++) {
      const el = document.createElement('div');
      el.className = 'bh';
      el.innerHTML = '♥';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (28 + Math.random() * 45) + 'px';
      el.style.animationDuration = (14 + Math.random() * 12) + 's';
      el.style.animationDelay = Math.random() * 8 + 's';
      box.appendChild(el);
    }
  }

  function startIntro() {
    const intro = document.getElementById('intro');
    intro.classList.add('show');
    
    progress = 0;
    draw();
    createMatrix();

    setTimeout(() => {
      intro.classList.add('hide');
      
      setTimeout(() => {
        document.getElementById('main').classList.add('show');
        createBgHearts();
        
        setTimeout(() => document.getElementById('title').classList.add('show'), 200);
        setTimeout(() => document.getElementById('line').classList.add('show'), 500);
        setTimeout(() => document.getElementById('text').classList.add('show'), 800);
        setTimeout(() => document.getElementById('sign').classList.add('show'), 1200);
      }, 1000);
    }, 4500);
  }
</script>
</body>
</html>
