<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Gülsüm ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .bg {
            position: fixed;
            inset: 0;
            background: url('IMG_20260820_154912.jpg') center/cover no-repeat;
            filter: brightness(0.48) contrast(1.15) saturate(1.05);
            z-index: -10;
            transform: scale(1.16);
            animation: slowZoom 40s ease-in-out infinite alternate;
        }

        @keyframes slowZoom {
            from { transform: scale(1.16); }
            to { transform: scale(1.04); }
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 20%, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.45) 55%, rgba(0,0,0,0.75) 100%);
            z-index: -9;
        }

        #heartCanvas {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #000;
            transition: opacity 2.2s ease;
        }

        #heartCanvas.hide {
            opacity: 0;
            pointer-events: none;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px 80px;
            text-align: center;
            opacity: 0;
            transition: opacity 2.5s ease;
            position: relative;
            z-index: 5;
        }

        .page.show { opacity: 1; }

        h1 {
            font-size: clamp(3.2rem, 10vw, 5.5rem);
            font-weight: 200;
            letter-spacing: 0.18em;
            margin-bottom: 12px;
            text-shadow: 0 0 40px rgba(255, 90, 150, 0.55), 0 0 80px rgba(255, 60, 120, 0.25);
        }

        .tagline {
            font-size: 1.05rem;
            letter-spacing: 0.35em;
            color: rgba(255,255,255,0.65);
            margin-bottom: 50px;
            font-weight: 300;
        }

        .message-area {
            max-width: 740px;
            min-height: 150px;
            margin-bottom: 45px;
            font-size: 1.35rem;
            line-height: 1.9;
            font-weight: 300;
            text-shadow: 0 4px 25px rgba(0,0,0,0.9);
            transition: all 0.55s ease;
            padding: 0 12px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            max-width: 700px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 13px 26px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.22);
            background: rgba(255,255,255,0.07);
            color: #fff;
            font-size: 0.98rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            user-select: none;
        }

        .btn:hover {
            background: rgba(255, 100, 150, 0.22);
            border-color: rgba(255, 130, 170, 0.55);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 70, 130, 0.25);
        }

        .btn:active { transform: scale(0.96); }

        .btn.special {
            background: rgba(255, 80, 130, 0.18);
            border-color: rgba(255, 100, 150, 0.4);
        }

        .extra-section {
            max-width: 700px;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(25px);
            transition: all 0.8s ease;
            pointer-events: none;
        }

        .extra-section.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .extra-section p {
            font-size: 1.2rem;
            line-height: 1.85;
            margin-bottom: 18px;
            color: rgba(255,255,255,0.92);
        }

        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            opacity: 0;
            animation: rise linear infinite;
            filter: blur(0.4px);
        }

        @keyframes rise {
            0% { transform: translateY(105vh) rotate(0deg) scale(0.5); opacity: 0; }
            12% { opacity: 0.9; }
            88% { opacity: 0.5; }
            100% { transform: translateY(-20vh) rotate(720deg) scale(1.45); opacity: 0; }
        }

        .note {
            position: fixed;
            bottom: 18px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.25);
            z-index: 6;
        }

        @media (max-width: 600px) {
            .message-area { font-size: 1.18rem; }
            .btn { padding: 12px 20px; font-size: 0.92rem; }
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>
    <div class="bg"></div>
    <div class="overlay"></div>

    <div class="page" id="page">
        <h1>GÜLSÜM</h1>
        <div class="tagline">senin için</div>

        <div class="message-area" id="message">
            Bazı güzellikler anlatılmaz,<br>
            sadece hissedilir.
        </div>

        <div class="btn-group">
            <button class="btn" onclick="changeMessage(0)">Bir bakış</button>
            <button class="btn" onclick="changeMessage(1)">Bir his</button>
            <button class="btn" onclick="changeMessage(2)">Bir gerçek</button>
            <button class="btn" onclick="changeMessage(3)">Bir itiraf</button>
            <button class="btn special" onclick="showFinal()">Son söz</button>
            <button class="btn" onclick="rainHearts()">❤️</button>
        </div>

        <div class="extra-section" id="extra">
            <p>Senin varlığın, kelimelerin yetmediği yerde bile huzur bırakıyor.</p>
            <p>Bu satırları yazarken bile gülümsedim.</p>
            <p style="margin-top: 25px; color: #ff8fb3;">İyi ki dünyadasın Gülsüm.</p>
        </div>
    </div>

    <div class="particles" id="particles"></div>
    <div class="note">sadece senin için</div>

    <script>
        // Canvas Heart
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, progress = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function heart(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return {
                x: width / 2 + x * scale,
                y: height / 2 + y * scale
            };
        }

        function drawHeart() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.065)';
            ctx.fillRect(0, 0, width, height);

            for (let layer = 0; layer < 5; layer++) {
                const scale = 9.2 + layer * 1.85;
                const alpha = 0.95 - layer * 0.13;

                ctx.beginPath();
                ctx.strokeStyle = `rgba(255, 75, 130, ${alpha})`;
                ctx.lineWidth = 1.7 - layer * 0.12;
                ctx.shadowBlur = 18;
                ctx.shadowColor = '#ff4d7a';

                for (let t = 0; t < progress * Math.PI * 2; t += 0.014) {
                    const p = heart(t, scale);
                    if (t === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();
            }

            progress += 0.0037;

            if (progress < 1.42) {
                requestAnimationFrame(drawHeart);
            } else {
                setTimeout(() => {
                    canvas.classList.add('hide');
                    document.getElementById('page').classList.add('show');
                    startParticles();
                }, 1000);
            }
        }

        drawHeart();

        // Daha edebi mesajlar
        const messages = [
            "Gözlerin, bakılan her yeri biraz daha yumuşak, biraz daha yaşanılır kılıyor.",
            "Senin yanındayken zamanın acele etmediğini, her anın kendine ait bir değeri olduğunu hissediyorum.",
            "Bazı insanlar sadece güzel değildir; bulundukları yere de güzellik bırakırlar. Sen onlardan birisin.",
            "Seni düşünmek, içimde hiç eksilmeyen bir sıcaklık bırakıyor. Kelimeler bazen yetmiyor, ama his yetiyor."
        ];

        function changeMessage(index) {
            const el = document.getElementById('message');
            el.style.opacity = '0';
            el.style.transform = 'translateY(12px)';

            setTimeout(() => {
                el.innerHTML = messages[index];
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
            }, 280);

            document.getElementById('extra').classList.remove('visible');
        }

        function showFinal() {
            const el = document.getElementById('message');
            el.style.opacity = '0';

            setTimeout(() => {
                el.innerHTML = "Artık fazla söze gerek yok.";
                el.style.opacity = '1';
            }, 300);

            setTimeout(() => {
                document.getElementById('extra').classList.add('visible');
            }, 700);
        }

        function rainHearts() {
            for (let i = 0; i < 34; i++) {
                setTimeout(() => createParticle(true), i * 50);
            }
        }

        function startParticles() {
            setInterval(() => createParticle(false), 260);
        }

        function createParticle(isRain = false) {
            const container = document.getElementById('particles');
            const symbols = isRain ? ['❤️', '💗', '💖'] : ['❤️', '✨', '💕', '✧', '💗'];

            const el = document.createElement('div');
            el.className = 'particle';
            el.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = (Math.random() * (isRain ? 22 : 18) + (isRain ? 16 : 13)) + 'px';
            el.style.animationDuration = (Math.random() * 8 + (isRain ? 7 : 11)) + 's';
            el.style.color = `rgba(255, ${120 + Math.random() * 80}, ${150 + Math.random() * 50}, 0.85)`;

            container.appendChild(el);
            setTimeout(() => el.remove(), 20000);
        }
    </script>
</body>
</html>
